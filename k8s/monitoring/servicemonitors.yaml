# ServiceMonitors for all Plots microservices and infra exporters.
# Prometheus Operator (installed via kube-prometheus-stack) picks these up automatically
# because helm-values.yaml sets serviceMonitorSelector: {} (match all).
#
# Apply with: kubectl apply -f k8s/monitoring/servicemonitors.yaml

# ── Application services ──────────────────────────────────────────────────────

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: api-gateway
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - plots-system
  selector:
    matchLabels:
      app: api-gateway
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s

